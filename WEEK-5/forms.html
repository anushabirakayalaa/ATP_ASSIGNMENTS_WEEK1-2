<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <!--username-->
        <div>
            <label for="">Username</label>
            <input type="text" name="" id="un" required minlength="4">
            <!--for->to connect i/p elem and id->to uniquely identify a element-->
        </div>
        <div>
            <label for="">Password</label>
            <input type="password" name="" id="">

        <!--skills-->
            <div>
            <!--skill 1-->
            <div>
                <input type="checkbox" name="html" id="html">
                <label for="html">html</label>
            </div>
            <div>
                <input type="checkbox" name="react" id="react">
                <label for="react">react</label>
            </div>
            </div>
        
        </div>
        <!--gender-->
        <h4>Select Gender</h4>
        <div>
            <div>
                <input type="radio" name="gender" id="Male">
                <label for="Male">MALE</label>
            </div>
            <div>
                <input type="radio" name="gender" id="Female">
                <label for="Female">FEMALE</label>
            </div>
        </div>
        <!---states-->
        <div>
            <label for="">Select a state</label>
            <select name="state" id="">
                <option value="Tg">Telangana</option>
                <option value="Ap">Andra Pradesh</option>
            </select>
        </div>
            <label for="">Email</label>
            <input type="text" name="" id="">
        <div>
            <label for="">DateOfBirth</label>
            <input type="date" name="" id="">
        </div>
        <button type="submit">Register</button>
    </form>
</body>
</html>
